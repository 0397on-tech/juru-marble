<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주루마블 OBS 28칸</title>
<style>
  :root{
    --cell-gap: 8px;
    --radius: 20px;
    --line: rgba(255,255,255,.22);
    --shadow: 0 10px 28px rgba(0,0,0,.28);
    --panel: rgba(11,14,24,.94);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:#fff}
  body{display:grid;place-items:center}

  #stage{
    position:relative;
    width:1920px;height:1080px;
    transform-origin:center center;
    background:transparent;
  }

  /* 중앙은 스트리머 카메라 송출을 위해 투명 */
  #camera-safe{
    position:absolute;
    left:258px; right:258px; top:170px; bottom:170px;
    border:2px dashed rgba(255,255,255,.28);
    border-radius:34px;
    pointer-events:none;
    opacity:0;
    transition:.2s;
  }
  body.admin #camera-safe{opacity:1}
  #camera-safe::after{
    content:"스트리머 얼굴 송출 영역 (OBS에서 카메라 소스를 이 웹소스 아래에 배치)";
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    color:rgba(255,255,255,.55);font-size:26px;font-weight:800;letter-spacing:-1px;white-space:nowrap;
  }

  .cell{
    position:absolute;
    border:3px solid rgba(255,255,255,.88);
    border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 0 0 2px rgba(0,0,0,.18);
    overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    padding:12px 10px 10px;
    text-shadow:0 3px 4px rgba(0,0,0,.85);
    user-select:none;
  }
  .cell .num{
    position:absolute;top:8px;left:10px;
    width:38px;height:38px;border-radius:12px;
    display:grid;place-items:center;background:rgba(0,0,0,.58);
    font-size:22px;font-weight:950;line-height:1;
  }
  .cell .icon{font-size:40px;line-height:1;margin-bottom:5px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
  .cell .name{font-size:30px;font-weight:950;line-height:1.08;letter-spacing:-1.8px;word-break:keep-all}
  .cell .mission{font-size:17px;font-weight:800;line-height:1.15;margin-top:6px;color:#fff;opacity:.9;max-width:94%;display:none}
  body.admin .cell{cursor:pointer}
  body.show-missions .cell .mission{display:block}
  body.admin .cell:hover{outline:5px solid #fff;outline-offset:-5px;filter:brightness(1.07)}
  .cell.start{background:linear-gradient(135deg,#ff315d,#ff6a45)!important}
  .cell.start .name{font-size:36px;color:#fff36b}

  /* Editor */
  #toolbar{
    position:fixed;z-index:1000;top:18px;left:18px;
    display:flex;gap:10px;align-items:center;
    background:var(--panel);padding:10px 12px;border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)
  }
  #toolbar button,#editor button,#toolbar select{
    border:0;border-radius:12px;padding:10px 14px;background:#fff;color:#111;font-weight:900;font-size:14px;cursor:pointer
  }
  #toolbar button.secondary,#editor button.secondary{background:#30384d;color:#fff}
  #toolbar .status{font-size:13px;color:#9ee7ff;font-weight:800;min-width:118px}
  #editor{
    position:fixed;z-index:1001;right:18px;top:18px;width:340px;max-height:calc(100vh - 36px);overflow:auto;
    background:var(--panel);padding:18px;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12)
  }
  #editor h2{margin:0 0 14px;font-size:22px}
  #editor label{display:block;font-size:13px;font-weight:850;color:#bec7d9;margin:12px 0 6px}
  #editor input,#editor textarea,#editor select{
    width:100%;border:1px solid #3d465c;background:#171c2a;color:#fff;border-radius:12px;padding:11px 12px;font-size:15px;outline:none
  }
  #editor textarea{height:84px;resize:vertical}
  #editor .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #editor .actions{display:flex;gap:8px;margin-top:14px}
  #editor .hint{font-size:12px;line-height:1.45;color:#9aa6bc;margin-top:10px}
  #editor.hidden{display:none}
  body:not(.admin) #toolbar, body:not(.admin) #editor{display:none}

  /* 1920x1080 stage sizing */
  .top,.bottom{width:228px;height:158px}
  .side{width:246px;height:116px}

  @media (max-width:900px){
    #editor{width:300px}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="camera-safe"></div>
  <div id="board"></div>
</div>

<div id="toolbar">
  <button id="toggleEditor">편집창</button>
  <button id="toggleMission" class="secondary">미션표시</button>
  <button id="resetBtn" class="secondary">초기화</button>
  <span class="status" id="status">실시간 반영 준비</span>
</div>

<div id="editor" class="hidden">
  <h2 id="editorTitle">칸 편집</h2>
  <label>칸 번호</label>
  <input id="eNum" disabled>
  <label>칸 이름</label>
  <input id="eName" maxlength="18">
  <label>미션 / 설명</label>
  <textarea id="eMission" maxlength="100"></textarea>
  <div class="row">
    <div>
      <label>아이콘</label>
      <input id="eIcon" maxlength="4" placeholder="🍺">
    </div>
    <div>
      <label>색상</label>
      <input id="eColor" type="color">
    </div>
  </div>
  <div class="actions">
    <button id="saveBtn">저장 / 즉시반영</button>
    <button id="closeBtn" class="secondary">닫기</button>
  </div>
  <div class="hint">OBS 방송용 주소에는 <b>?obs=1</b>을 붙이세요. 편집 화면은 <b>?admin=1</b>을 붙이면 됩니다. 같은 브라우저/같은 사이트 주소에서는 수정 내용이 즉시 동기화됩니다.</div>
</div>

<script>
const COLORS=['#ef476f','#06d6a0','#ffd166','#2ec4ff','#8b5cf6','#ff8a35','#3ddc97','#ff4fa3'];
const DEFAULTS=[
 ['START','🏁','출발!'],['소주 1잔','🍶','소주 1잔 마시기'],['미션','📋','랜덤 미션 수행'],['맥주 1잔','🍺','맥주 1잔 마시기'],['앞으로 1칸','➡️','말을 1칸 앞으로 이동'],['벌칙','😈','랜덤 벌칙 수행'],['안주 먹기','🍗','안주 한입 먹기'],['특별 이벤트','🎁','특별 이벤트 실행'],
 ['두 잔 마시기','🥂','두 잔 마시기'],['물 한잔','💧','물 한잔 마시기'],['뒤로 1칸','⬅️','말을 1칸 뒤로 이동'],['꽝','💥','아무 일 없음'],['건배타임','🍻','다 같이 건배'],['폭탄주','💣','폭탄주 미션'],
 ['쉬어가기','😴','이번 미션 면제'],['노래 1절','🎤','노래 한 곡 1절 부르기'],['안주 선택권','🍢','원하는 안주 선택'],['벌칙 면제','😇','벌칙 1회 면제'],['주사위 한 번 더','🎲','주사위를 한 번 더 굴리기'],['옆사람과 반잔','🥃','옆사람과 반잔씩'],['이동 미션','🏃','랜덤 이동 미션'],['모두 한 모금','🥳','전원 한 모금'],['댄스 미션','🪩','댄스 미션 수행'],['한 턴 쉬기','🛏️','한 턴 쉬기'],['원샷','🥃','원샷'],['복불복','🎲','복불복 미션'],['소원권','🧞','소원권 1회'],['마지막 한 잔','🥂','마지막 한 잔']
];

const KEY='juru-marble-28-v1';
const bc=('BroadcastChannel' in window)?new BroadcastChannel('juru-marble-live'):null;
let selected=0;
let data=loadData();

function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(saved)&&saved.length===28)return saved;
  }catch(e){}
  return DEFAULTS.map((x,i)=>({num:i+1,name:x[0],icon:x[1],mission:x[2],color:COLORS[i%COLORS.length]}));
}
function persist(){
  localStorage.setItem(KEY,JSON.stringify(data));
  if(bc)bc.postMessage({type:'sync',data});
  flash('방송 화면에 반영됨');
}
function flash(msg){
  const s=document.getElementById('status'); if(!s)return;
  s.textContent=msg; clearTimeout(flash.t); flash.t=setTimeout(()=>s.textContent='실시간 반영 준비',1800);
}
function cellPos(i){
  // 1-8 top, 9-14 right, 15-22 bottom (right->left), 23-28 left (bottom->top)
  const gap=8, sideW=246, topH=158, topW=228;
  if(i<8) return {cls:'top', x:gap+i*(topW+gap), y:gap};
  if(i<14) return {cls:'side', x:1920-sideW-gap, y:170+(i-8)*(116+8)};
  if(i<22) return {cls:'bottom', x:gap+(21-i)*(topW+gap), y:1080-topH-gap};
  return {cls:'side', x:gap, y:170+(27-i)*(116+8)};
}
function render(){
  const board=document.getElementById('board'); board.innerHTML='';
  data.forEach((d,i)=>{
    const p=cellPos(i),el=document.createElement('div');
    el.className='cell '+p.cls+(i===0?' start':'');
    el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.background=`linear-gradient(145deg,${d.color},${shade(d.color,-25)})`;
    el.innerHTML=`<div class="num">${d.num}</div><div class="icon">${escapeHtml(d.icon)}</div><div class="name">${escapeHtml(d.name)}</div><div class="mission">${escapeHtml(d.mission)}</div>`;
    el.addEventListener('click',()=>{if(document.body.classList.contains('admin'))openEditor(i)});
    board.appendChild(el);
  });
}
function shade(hex,amt){
  let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let n=parseInt(c,16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function openEditor(i){
  selected=i; const d=data[i];
  document.getElementById('editor').classList.remove('hidden');
  document.getElementById('editorTitle').textContent=`${d.num}번 칸 편집`;
  eNum.value=d.num;eName.value=d.name;eMission.value=d.mission;eIcon.value=d.icon;eColor.value=d.color;
}
function saveEditor(){
  const d=data[selected]; d.name=eName.value.trim()||`칸 ${d.num}`;d.mission=eMission.value.trim();d.icon=eIcon.value.trim()||'⭐';d.color=eColor.value;
  persist();render();
}
function fit(){
  const s=document.getElementById('stage');
  const scale=Math.min(innerWidth/1920,innerHeight/1080);
  s.style.transform=`scale(${scale})`;
}

const params=new URLSearchParams(location.search);
const admin=params.get('admin')==='1';
const obs=params.get('obs')==='1';
if(admin)document.body.classList.add('admin');
if(params.get('missions')==='1')document.body.classList.add('show-missions');
if(obs){ document.body.classList.remove('admin'); document.body.classList.remove('show-missions'); }

window.addEventListener('storage',e=>{if(e.key===KEY){data=loadData();render();}});
if(bc)bc.onmessage=e=>{if(e.data?.type==='sync'&&Array.isArray(e.data.data)){data=e.data.data;render();}};

document.getElementById('toggleEditor').onclick=()=>document.getElementById('editor').classList.toggle('hidden');
document.getElementById('toggleMission').onclick=()=>document.body.classList.toggle('show-missions');
document.getElementById('saveBtn').onclick=saveEditor;
document.getElementById('closeBtn').onclick=()=>document.getElementById('editor').classList.add('hidden');
document.getElementById('resetBtn').onclick=()=>{if(confirm('28칸 내용을 기본값으로 초기화할까요?')){localStorage.removeItem(KEY);data=loadData();persist();render();}};
window.addEventListener('resize',fit);
render();fit();
</script>
</body>
</html>
